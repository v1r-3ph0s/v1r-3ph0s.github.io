<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="404 — Page Not Found | CyberVault">
  <title>404 — Page Not Found | CyberVault</title>
  <link rel="icon" type="image/svg+xml" href="https://v1r-3ph0s.github.io/assets/img/avatar.svg">
  <link rel="stylesheet" href="https://v1r-3ph0s.github.io/assets/css/main.css">
  <link rel="stylesheet" href="https://v1r-3ph0s.github.io/assets/css/responsive.css">
  <script src="https://v1r-3ph0s.github.io/assets/js/theme.js"></script>
  <style>
    .terminal-404 {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 1.5rem 0;
      text-align: left;
      display: inline-block;
    }
    .t-line { display: block; line-height: 1.8; }
    .t-err  { color: var(--danger); }
    .t-ok   { color: var(--accent); }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div id="app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="profile" id="sidebarProfile"></div>
        <div class="sidebar-divider"></div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-divider"></div>
        <div class="sidebar-stats" id="sidebarStats"></div>
        <div class="sidebar-divider"></div>
        <div class="social-links" id="sidebarSocial"></div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle sidebar" aria-expanded="false">&#9776;</button>
        <span class="topbar-brand" id="topbarBrand"></span>
        <div class="search-wrap" role="search">
          <div class="search-input-wrap">
            <span class="search-icon">&#128269;</span>
            <input type="search" id="searchInput" placeholder="Search posts… (press /)" autocomplete="off" aria-label="Search posts">
          </div>
          <div class="search-results" id="searchResults" role="listbox"></div>
        </div>
        <div class="topbar-actions">
          <button class="theme-toggle" id="themeToggle">&#9728;</button>
        </div>
      </header>

      <main id="main-content">
        <div class="error-page">
          <div class="error-code">404</div>
          <div class="error-message">Page Not Found</div>

          <div class="terminal-404">
            <span class="t-line"><span style="color:#4d5b6e">$</span> curl <span style="color:#ffa657" id="errorUrl">https://cybervault.dev/???</span></span>
            <span class="t-line t-err">curl: (404) Not Found — The target does not exist</span>
            <span class="t-line" style="color:#4d5b6e">--- traceback ---</span>
            <span class="t-line"><span style="color:#4d5b6e">errno:</span> <span class="t-err">ENOENT</span></span>
            <span class="t-line"><span style="color:#4d5b6e">hint:</span>  <span class="t-ok">try navigating back to /</span></span>
          </div>

          <p class="error-desc">The page you are looking for has been moved, deleted, or never existed.</p>
          <div class="error-actions">
            <a href="index.html" class="btn btn-primary">&#8962; Go Home</a>
            <a href="archives.html" class="btn btn-secondary">&#128196; Browse Archives</a>
          </div>
        </div>
      </main>

      <footer class="site-footer" id="siteFooter"></footer>
    </div>
  </div>

  <button class="back-to-top" id="backToTop" aria-label="Back to top">&#8679;</button>

  <script src="https://v1r-3ph0s.github.io/config.js"></script>
  <script src="https://v1r-3ph0s.github.io/assets/js/search.js"></script>
  <script src="https://v1r-3ph0s.github.io/assets/js/main.js"></script>
  <script>
    // Display the current URL in the terminal output
    const urlEl = document.getElementById('errorUrl');
    if (urlEl) urlEl.textContent = window.location.href;
  </script>
</body>
</html>
