<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" rx="100" fill="#0d1117"/>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.4"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Grid pattern (subtle) -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00ff88" stroke-width="0.3" opacity="0.15"/>
    </pattern>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="88"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#grid)" clip-path="url(#circle-clip)"/>
  
  <!-- Skull shape -->
  <!-- Skull cranium -->
  <ellipse cx="100" cy="90" rx="38" ry="34" fill="#161b22" stroke="#00ff88" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Skull eye sockets -->
  <ellipse cx="87" cy="87" rx="9" ry="10" fill="#00ff88" opacity="0.9"/>
  <ellipse cx="113" cy="87" rx="9" ry="10" fill="#00ff88" opacity="0.9"/>
  
  <!-- Eye pupils (dark) -->
  <ellipse cx="87" cy="87" rx="5" ry="6" fill="#0d1117"/>
  <ellipse cx="113" cy="87" rx="5" ry="6" fill="#0d1117"/>
  
  <!-- Eye glow centers -->
  <circle cx="87" cy="87" r="2.5" fill="#00ff88" opacity="0.7"/>
  <circle cx="113" cy="87" r="2.5" fill="#00ff88" opacity="0.7"/>
  
  <!-- Nose cavity -->
  <path d="M 96 98 L 100 94 L 104 98 L 101.5 103 L 98.5 103 Z" fill="#00ff88" opacity="0.6"/>
  
  <!-- Jaw -->
  <rect x="72" y="111" width="56" height="18" rx="4" fill="#161b22" stroke="#00ff88" stroke-width="1.5"/>
  
  <!-- Teeth -->
  <rect x="76"  y="113" width="8"  height="12" rx="2" fill="#00ff88" opacity="0.85"/>
  <rect x="87"  y="113" width="8"  height="14" rx="2" fill="#00ff88" opacity="0.85"/>
  <rect x="98"  y="113" width="8"  height="14" rx="2" fill="#00ff88" opacity="0.85"/>
  <rect x="109" y="113" width="8"  height="12" rx="2" fill="#00ff88" opacity="0.85"/>
  
  <!-- Jaw side connectors -->
  <rect x="66" y="109" width="8" height="14" rx="3" fill="#161b22" stroke="#00ff88" stroke-width="1.5"/>
  <rect x="126" y="109" width="8" height="14" rx="3" fill="#161b22" stroke="#00ff88" stroke-width="1.5"/>

  <!-- Terminal cursor / hacker symbol -->
  <text x="100" y="160" text-anchor="middle" font-family="monospace" font-size="11" fill="#00ff88" opacity="0.8">&gt;_ root@cybervault</text>
  
  <!-- Corner brackets (hacker aesthetic) -->
  <path d="M 20 20 L 20 35 M 20 20 L 35 20" stroke="#00ff88" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <path d="M 180 20 L 180 35 M 180 20 L 165 20" stroke="#00ff88" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <path d="M 20 180 L 20 165 M 20 180 L 35 180" stroke="#00ff88" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <path d="M 180 180 L 180 165 M 180 180 L 165 180" stroke="#00ff88" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Scanning line animation -->
  <rect x="12" y="0" width="176" height="2" rx="1" fill="#00ff88" opacity="0.15" clip-path="url(#circle-clip)">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,180" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.2;0.2;0" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
